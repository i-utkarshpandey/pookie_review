.landing-photo,.final-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;z-index:-2}
.landing::before,.final-screen::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0005,#0008 48%,#000a)}
.landing-content,.audit-content,.final-content{width:min(100%,1000px);text-align:center}
h1,h2{font-family:"Open Sans",Arial,sans-serif;font-weight:800;font-size:clamp(36px,6.2vw,84px);line-height:1.08;letter-spacing:-.045em;text-transform:uppercase;margin:0;text-wrap:balance;text-shadow:0 3px 24px #0005}
.landing-sound,.audit-wrong{font-weight:700;text-transform:uppercase;font-size:clamp(13px,1.7vw,21px);letter-spacing:.06em;line-height:1.5;margin:25px 0 0}
.audit-wrong{margin:0 0 20px;letter-spacing:.14em}
.landing-actions,.final-actions{display:flex;justify-content:center;gap:14px;margin-top:38px}
.landing-button,.audit-choice,.final-button{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:18px 28px;border-radius:12px;font-family:"Open Sans",Arial,sans-serif;font-weight:700;font-size:14px;line-height:1.5;text-decoration:none;color:white;background:rgba(255,255,255,.14);border:1px solid #ffffff80;backdrop-filter:blur(12px);transition:background .2s,box-shadow .2s}
.landing-button-white{color:#242024;background:#fff;border-color:#fff}
.landing-button:hover,.audit-choice:hover,.final-button:hover{background:#ffffff40;box-shadow:0 8px 24px #0003}.landing-button-white:hover{background:#f4edf0}
button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:5px}
h1:focus,h2:focus{outline:none}
.audit-grid{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:0}
.audit-photo{position:relative;overflow:hidden;animation:photo-pop .7s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--photo-delay)}
.audit-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.audit-photo::after{content:"";position:absolute;inset:0;background:#0008}
.audit-options{display:flex;flex-direction:column;align-items:stretch;gap:14px;max-width:680px;margin:38px auto 0}.audit-choice{width:100%}
.audit-retry:not([hidden]){animation:pop-in .45s ease-out both}.audit-retry .audit-options{max-width:340px}
.final-button{min-width:140px}.no-slot{display:inline-flex;min-width:140px;min-height:58px}
#no.is-dodging{position:absolute;left:0;top:0;margin:0;z-index:5;transition:transform .42s cubic-bezier(.22,.8,.25,1),background .2s;will-change:transform}
.final-status{font-size:16px;line-height:1.5;margin:24px 0 0;font-weight:700;text-shadow:0 2px 12px #0009}
body.transitioning{overflow:hidden}.transitioning>.screen,.transitioning>.landing{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;will-change:transform}
@keyframes photo-pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes pop-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.screen,.landing{padding:48px 22px}h1,h2{font-size:clamp(34px,9vw,44px)}.landing-actions,.final-actions{gap:10px;margin-top:30px}.landing-button{padding:15px 12px;font-size:12px;flex:1;max-width:220px}.audit-options{gap:10px;margin-top:30px}.audit-choice{font-size:12px;padding:15px 18px}.final-button,.no-slot{min-width:110px}.final-photo{object-position:52% center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Final responsive polish: consistent type, spacing, safe areas and controls. */
html{color-scheme:dark;-webkit-text-size-adjust:100%;scrollbar-width:none}
body{background:#211b1b;-webkit-font-smoothing:antialiased}
html::-webkit-scrollbar{display:none}
.screen,.landing{padding:clamp(28px,6vh,72px) max(22px,env(safe-area-inset-right)) clamp(28px,6vh,72px) max(22px,env(safe-area-inset-left));min-height:100svh}
h1,h2{font-size:clamp(32px,5.7vw,76px);line-height:1.1;letter-spacing:-.04em;margin-inline:auto;overflow-wrap:break-word}
.landing h1{max-width:16ch}.audit-content h2{max-width:17ch}
.final-content h2{max-width:18ch;font-size:clamp(32px,5.3vw,70px)}
#thank-you-title{max-width:20ch;font-size:clamp(32px,5vw,68px)}
.landing-sound{margin-top:clamp(18px,3vh,28px)}
.landing-actions,.final-actions,.audit-options{margin-top:clamp(26px,4.5vh,42px)}
.audit-options{max-width:620px;gap:12px}
.landing-button,.audit-choice,.final-button{min-height:56px;padding:17px 24px;font-size:clamp(13px,1.05vw,15px);-webkit-backdrop-filter:blur(12px);border-color:#ffffff66;box-shadow:inset 0 1px 0 #ffffff14;touch-action:manipulation;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.landing-button:active,.audit-choice:active,.final-button:not(.is-dodging):active{transform:scale(.98)}
.landing-button-white{border-color:#fff}
.audit-retry:not([hidden]){animation:none}
.audit-photo{animation:none}
#survey-page:not([hidden]) .audit-photo{animation:photo-pop .7s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--photo-delay)}
.final-status{min-height:24px}
@media(hover:hover){.landing-button:hover,.audit-choice:hover,.final-button:not(.is-dodging):hover{transform:translateY(-2px)}}
@media(max-width:480px){h1,h2{font-size:clamp(30px,8.8vw,42px)}.final-content h2,#thank-you-title{font-size:clamp(30px,8.4vw,40px)}.landing-button{padding:15px 12px;font-size:12px}.audit-choice{padding:15px 18px;font-size:13px}.audit-options{gap:10px}.no-slot{min-height:56px}}
@media(max-height:500px) and (min-width:600px){.screen,.landing{padding:24px}h1,h2,.final-content h2,#thank-you-title{font-size:clamp(28px,5.8vh,40px);max-width:25ch}.landing-sound{margin-top:14px;font-size:13px}.audit-options,.landing-actions,.final-actions{margin-top:20px;gap:8px}.audit-choice,.landing-button,.final-button{min-height:46px;padding:11px 20px;font-size:12px}.audit-options{max-width:580px}.no-slot{min-height:46px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.landing-button:hover,.audit-choice:hover,.final-button:hover{transform:none!important}}

<script>

'use strict';
const $ = selector => document.querySelector(selector);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
// Reuse the existing photo grid without downloading duplicate assets.
$('#retry-page').prepend($('.audit-grid').cloneNode(true));
const screens = [...document.querySelectorAll('body > section')];
const titles = {landing:'landing-title','survey-page':'q1','retry-page':'retry-title','final-page':'final-title','thank-you-page':'thank-you-title'};
let active = 'landing', busy = false, queuedRoute = null, lastDodge = -Infinity;
const no = $('#no');
function routeFromURL() { const id = location.hash.slice(1); return Object.hasOwn(titles,id) ? id : 'landing'; }
function resetNo() { no.classList.remove('is-dodging'); no.style.removeProperty('transform'); lastDodge = -Infinity; }
function render(id, focus = true) {
 screens.forEach(screen => { screen.hidden = screen.id !== id; screen.inert = false; });
 active = id;
 window.scrollTo(0,0);
 if (id === 'final-page') resetNo();
 if (focus) { const heading = document.getElementById(titles[id]); heading.tabIndex = -1; heading.focus({preventScroll:true}); }
}
async function navigate(id, recordHistory = true) {
 if (busy) { if (!recordHistory) queuedRoute = id; return; }
 if (active === id) return;
 busy = true;
 const outgoing = document.getElementById(active), incoming = document.getElementById(id);
 const animations = [];
 try {
  if (!reducedMotion.matches && outgoing.animate) {
   const scrollOffset = window.scrollY, height = window.innerHeight;
   incoming.hidden = false; outgoing.inert = true; incoming.inert = true;
   document.body.classList.add('transitioning');
   window.scrollTo(0,0);
   const timing = {duration:780, easing:'cubic-bezier(.65,0,.25,1)', fill:'both'};
   animations.push(outgoing.animate([{transform:`translateY(${-scrollOffset}px)`},{transform:`translateY(${-height-scrollOffset}px)`}],timing));
   animations.push(incoming.animate([{transform:`translateY(${height}px)`},{transform:'translateY(0)'}],timing));
   await Promise.all(animations.map(animation => animation.finished));
  }
 } catch { /* Interrupted animation still commits a usable destination. */ }
 finally {
  outgoing.hidden = true;
  animations.forEach(animation => animation.cancel());
  document.body.classList.remove('transitioning');
  if (recordHistory && queuedRoute === null) history.pushState(null,'','#'+id);
  render(id);
  busy = false;
  if (queuedRoute !== null) { const next = queuedRoute; queuedRoute = null; navigate(next,false); }
 }
}
window.addEventListener('hashchange',() => navigate(routeFromURL(),false));
document.querySelectorAll('.landing-button').forEach(button => button.addEventListener('click',event => {
 event.preventDefault(); navigate('survey-page');
}));
document.querySelectorAll('[data-answer]').forEach(button => button.addEventListener('click',() => {
 navigate(button.dataset.answer === 'right' ? 'final-page' : 'retry-page');
}));
$('#retry-answer').addEventListener('click',() => navigate('survey-page'));
$('#yes').addEventListener('click',() => navigate('thank-you-page'));
function dodge(event) {
 if (busy || reducedMotion.matches) return;
 if (event) event.preventDefault();
 const now = performance.now();
 if (now-lastDodge < 450) return;
 lastDodge = now;
 const screen = $('#final-page'), bounds = screen.getBoundingClientRect();
 const old = no.getBoundingClientRect(), yes = $('#yes').getBoundingClientRect();
 const pad = 16, width = old.width, height = old.height;
 // Coordinates stay inside the visible viewport, including on scrolled phones.
 const minY = Math.max(pad,-bounds.top+pad);
 const maxX = Math.max(pad,bounds.width-width-pad);
 const maxY = Math.max(minY,Math.min(bounds.height,innerHeight-bounds.top)-height-pad);
 if (!no.classList.contains('is-dodging')) {
  no.classList.add('is-dodging');
  no.style.transition = 'none';
  no.style.transform = `translate(${old.left-bounds.left}px,${old.top-bounds.top}px)`;
  no.getBoundingClientRect();
  no.style.removeProperty('transition');
 }
 let best = null;
 for (let i=0; i<60; i++) {
  const x=pad+Math.random()*(maxX-pad), y=minY+Math.random()*(maxY-minY);
  const left=x+bounds.left, top=y+bounds.top;
  if(left<yes.right+20 && left+width>yes.left-20 && top<yes.bottom+20 && top+height>yes.top-20) continue;
  const distance=Math.hypot(left-old.left,top-old.top);
  if(!best || distance>best.distance) best={x,y,distance};
 }
 if(best) no.style.transform=`translate(${best.x}px,${best.y}px)`;
}
no.addEventListener('pointerenter',event => {if(event.pointerType==='mouse') dodge(event);});
no.addEventListener('pointerdown',event => {if(event.pointerType!=='mouse') dodge(event);});
no.addEventListener('click',event => {
 if(reducedMotion.matches) {$('#final-status').hidden=false;$('#final-status').textContent='Take your time, G.';}
 else dodge(event);
});
window.addEventListener('resize',resetNo);
reducedMotion.addEventListener('change',event => {
 if(event.matches) { document.getAnimations().forEach(animation => animation.finish()); resetNo(); }
});
render(routeFromURL(),location.hash.length>0);
</script>
</body>
